ы и на φ не умножаются: при низкой связности платформа убыточна. Поглощают 29 % валовой экономии.",src:"Глава 2, табл. 2.6, § 2.5.4.",rel:["dE_t","C_min"]},dE_base:{sym:"ΔE_base",name:"Чистый эффект при полной реализации",group:"Эффект",what:"Дополнительный эффект экоплатформы при φ = 1: сумма вкладов потоков минус затраты платформы. Заменяет валовые 250 млн руб. прежней версии симулятора.",calc:"ΔE_base = Σ(E_i − A_i) − Z_пл = 187,1 − 69,6 = 117,4 млн руб./год",src:"Глава 2, табл. 2.6; перенос в симулятор — табл. 3.7.",rel:["dE_t","flows","Z_pl"]},dE_t:{sym:"ΔE(t)",name:"Верифицированный дополнительный эффект",group:"Эффект",what:"Изменение денежных потоков участников относительно состояния «без платформы» за вычетом затрат на создание и поддержание связей.",calc:"ΔE(t) = φ(C_инд) · Σ(E_i − A_i) − Z_пл (2.7) в редакции симулятора",effect:"База симбиотического дивиденда; при ΔE < 0 дивиденд не начисляется и долг не переносится.",src:"Глава 2, § 2.3.1; контрфактическое правило «с платформой — без платформы».",rel:["SD","phi","Z_pl","C_min"]},C_min:{sym:"C_min",name:"Порог окупаемости платформы",group:"Эффект",what:"Связность, при которой реализованный эффект потоков покрывает постоянные затраты платформы: ΔE(t) = 0.",calc:"C_min = −ln(1 − Z_пл / Σ(E_i − A_i)) / k",effect:"При k = 5 около 0,093. Ниже порога платформа уменьшает общественный результат — задача оператора вывести сеть за порог.",src:"Следует из (2.5) и (2.7); кандидат в элементы новизны (§ 3.2).",rel:["dE_t","Z_pl","k"]},dE_exp:{sym:"ΔE_ожид",name:"Ожидаемый эффект с риском якоря",group:"Эффект",what:"Эффект с учётом того, что в доле периода π_A якорь не поставляет CO₂, а аннуитет вложений сохраняется.",calc:"ΔE_ожид = (Σ − π_A · E_CO₂) · φ − Z_пл",src:"§ 3.2.4, формулы (3.24)–(3.25).",rel:["pi_A","dE_t"]},Q0:{sym:"Q₀",name:"Базовые продажи пищевой CO₂",group:"Эффект",what:"Объём, который «Азот» продаёт с декабря 2018 г. без платформы: 32 тыс. т в год. Связь уже действует.",calc:"ΔE_CO₂ = (Q₁ − Q₀) · (p_а

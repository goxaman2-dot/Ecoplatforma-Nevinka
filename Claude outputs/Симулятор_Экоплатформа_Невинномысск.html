e:"Прирост продаж CO₂",group:"Эффект",what:"Дополнительные поставки технологического CO₂ сверх базовых 32 тыс. т, вызванные платформой.",effect:"Базовое значение 12 тыс. т (табл. 2.5: 8–15). Через u входит в эффект отдачи (3.28).",src:"Допущение, класс C.",rel:["Q0","u"]},switch:{sym:"Доля переключения",name:"Поставки за счёт переключения покупателей",group:"Эффект",what:"Часть поставок резидентам, которая раньше уходила другим покупателям. Договор появляется, совокупные продажи не растут.",effect:"Уменьшает вклад потока CO₂; проверяется только по помесячной отгрузке всем покупателям (§ 3.5).",src:"§ 2.3.2, § 3.1.6.",rel:["Q0"]},mu:{sym:"μ",name:"Признак углеродного вычета (CBAM)",group:"Эффект",what:"Равен 1, если переданный CO₂ вычитается из встроенных выбросов продукции якоря (постоянное связывание или геологическое хранение), иначе 0.",calc:"ΔE_f = ΔE_f^рын + μ_f · q_f · p_C (3.12)",effect:"Для напитков, сухого льда, теплиц и карбамида μ = 0: симбиоз не снижает углеродную нагрузку экспорта «Азота».",src:"Регламенты ЕС 2023/956, 2023/1773, 2024/2620; § 3.1.6. Класс A.",rel:["carbon"]},SD:{sym:"SD(t)",name:"Симбиотический дивиденд",group:"Дивиденд",what:"Доля подтверждённого эффекта, которая по заранее оговорённым правилам распределяется между участниками, оператором, бюджетом и экофондом.",calc:"SD(t) = α · M · max(0; ΔE(t)) (2.11)",effect:"Премия, а не основа стимулов: основной выигрыш резидента возникает в цене обмена. Около 5 % валовой экономии.",src:"Глава 1, § 1.4.1; глава 2, § 2.3.2.",rel:["alpha","M","dE_t","beta"]},alpha:{sym:"α",name:"Коэффициент дивиденда",group:"Дивиденд",what:"Доля подтверждённого эффекта, направляемая в распределительный механизм. Фиксируется соглашением до начала периода.",calc:"α ∈ [0,08; 0,12]",effect:"Линейно увеличивает SD, но почти не меняет участие малых резидентов: их доля дивиденда мала (следствие 2 табл. 3.8).",src:"Глава 2, § 2.3.2.",rel:["SD","sigma"]},M:{sym:"M",name:"Множитель режима распределения",group:"Дивиденд",what:"Повышающий коэффициент режима: фискальный 1,00, технологический 1,12, промышленный 1,18.",src:"Параметр симулятора, класс C.",rel:["SD"]},beta:{sym:"β(C)",name:"Доля бюджета территории (схема В)",group:"Дивиденд",what:"Доля дивиденда бюджету города, принимающего экологическую нагрузку. Растёт со связностью.",calc:"β(C) = 0,45 · φ + 0,25 · (1 − φ) (2.18)",src:"Глава 2, § 2.5.2.",rel:["gamma_gov","SD","ecofund"]},gamma_gov:{sym:"γ_гос(C)",name:"Доля публичного партнёра (схема Б)",group:"Дивиденд",what:"Возврат публичному инвестору в инфраструктуру; убывает с ростом связности, когда риск снижается.",calc:"γ_гос = 0,15 + (0,40 − 0,15) · (1 − φ) (2.17)",effect:"Противоположная динамика β и γ_гос — не противоречие: это две разные роли государства.",src:"Глава 2, § 2.5.2.",rel:["beta"]},gamma_res:{sym:"γ_рез",name:"Доля группы резидентов",group:"Дивиденд",what:"Часть дивиденда, распределяемая между резидентами пропорционально их подтверждённому эффекту.",calc:"D_j = γ_рез · SD · ΔE_j / ΣΔE_все (2.20′); доля неподключённых остаётся в резерве",effect:"Нормировка на весь потенциальный эффект группы убирает размывание дивиденда, поэтому Γ(C) не убывает.",src:"Глава 2, (2.20); уточнение для § 3.2.",rel:["SD","Gamma"]},ecofund:{sym:"Экофонд",name:"Экофонд ликвидации ущерба",group:"Дивиденд",what:"Постоянная доля 8 % дивиденда на рекультивацию фосфогипса, очистку вод.",src:"Схема В, (2.18).",rel:["C_liq","beta"]},shapley:{sym:"Sh_i",name:"Вектор Шепли",group:"Дивиденд",what:"Справедливая доля участника — средний предельный вклад по всем порядкам присоединения к коалиции. Используется как контрольный критерий, а не правило выплат.",calc:"Sh_i(v̄) = (1 − π_A) · Sh_i(v) + π_A · Sh_i(v_−A) (3.25)",effect:"При s = 0,3 на «Азот» приходится 25 % эффекта, с поправкой на риск остановки — 0,95 · 29,4 ≈ 27,9 млн руб.",src:"Глава 1, (1.9); § 2.5.3; § 3.2.4.",rel:["pi_A"]},C_liq:{sym:"C_ликв",name:"Потребность в ликвидации ущерба",group:"Бюджет",what:"Годовые средства на ликвидацию накопленного экологического ущерба: 15,5–20,5 млн руб.",calc:"Ограничение γ_пуб · SD(C**) + B_внеш ≥ C_ликв (3.21)",effect:"Одним дивидендом не покрывается ни в одном сценарии: бюджет получает 1–4 млн руб.",src:"Параметр симулятора, класс C.",rel:["B_ext","beta","ecofund"]},B_ext:{sym:"B_внеш",name:"Внешний источник финансирования",group:"Бюджет",what:"Средства на ликвидацию ущерба вне дивиденда: целевое использование платы за НВОС, межбюджетный трансферт края городу, соглашения о партнёрстве.",effect:"Закрывает дефицит (3.21). Для края — расход, для города — доход: перенос между уровнями бюджета.",src:"§ 3.2.3; табл. 3.7.",rel:["C_liq","nvos"]},density:{sym:"C ≥ 15 %",name:"Ограничение синергетической плотности",group:"Бюджет",what:"Условие экосистемного режима: реализовано не менее 15 % допустимых связей.",src:"Параметр симулятора; сценарный ориентир.",rel:["C_ind","regime"]},nvos:{sym:"ΔНВОС",name:"Выпадающая плата за НВОС",group:"Бюджет",what:"Плата за негативное воздействие, которую предприятия перестают платить, выводя отходы из размещения. Для них — экономия, для бюджета — потеря дохода.",effect:"С 01.01.2026 плата зачисляется в бюджет субъекта на 100 % (488-ФЗ), долю города устанавливает край. Поэтому эффект в расширенной границе меньше: ΔE − ΔНВОС.",src:"Ставка 663,2 руб./т (ПП РФ № 913); БК РФ в ред. 488-ФЗ.",rel:["balance","B_ext"]},balance:{sym:"Σ = ΔE − ΔНВОС",name:"Замыкание баланса бенефициаров",group:"Бюджет",what:"Платформа создаёт новую стоимость только в размере ΔE. Цена обмена, дивиденд, налоги, σ и B_внеш — переливы. Сумма чистых выигрышей всех бенефициаров равна ΔE минус выпадающая плата за НВОС.",effect:"Если сумма больше — где-то двойной счёт.",src:"Методическое правило вкладки «Бенефициары и стратегии».",rel:["nvos","dE_t","omega"]},omega:{sym:"ω",name:"Положение цены в коридоре",group:"Бюджет",what:"Доля выигрыша обмена, достающаяся поставщику. 0,5 — середина коридора (решение Нэша при равной переговорной силе).",calc:"p_min = c_ij + o_i ≤ p_ij ≤ p , фильтр — сокращение платы за НВОС; «Эффективность ресурсов» — поток вторсырья. При значениях по умолчанию сумма вкладов равна 187,1.",src:"Параметры симулятора.",rel:["flows"]}},LX=["Связность","Эффект","Дивиденд","Бюджет","Двухуровневая модель","Механизмы","Поведение","Якорь","Стратегии","Показатели"],kt={N1:{tag:"Н1",level:"N",tab:"bilevel",title:"Двухуровневая модель равновесной связности экосистемы с якорным предприятием",claim:"Резиденты решают об участии с учётом нормы ТОСЭР на выручке проекта (нижний уровень), оператор и публичный партнёр выбирают параметры механизма при бюджетном ограничении на ликвидацию ущерба (верхний уровень). Равновесная связность C** определяется как наименьшая неподвижная точка отображения Γ(C; θ), а разрыв Δ_C = C* − C** показывает, сколько эффекта теряется из-за правил распределения и барьеров подключения.",where:"§ 3.2.2–3.2.3; формулы (3.15)–(3.21); вывод 2 по главе 3",prior:"Иерархическая постановка «администрация парка — предприятия» известна: игра Штакельберга с обратной оптимизацией (Tan, Aviso), двухуровневая модель лесопромышленного симбиоза (Daş и др.), субсидируемый водный симбиоз (Chin и др.).",diff:"В известных постановках нет якорного предприятия, нормы 50 % режима ТОСЭР в моногороде и бюджетного условия ликвидации накопленного ущерба (3.21). Все три элемента встроены в модель; при правиле дивиденда (2.20′) Γ не убывает по C, и равновесие существует по теореме Тарского.",check:"Переключайте механизм и сдвигайте σ: ступенчатая линия Γ смещается, точка C** — её первое пересечение с биссектрисой. Γ ни на одном участке не убывает."},N2:{tag:"Н2",level:"N",tab:"bilevel",title:"Цена закрытия разрыва связности Z_min и целевая связность Ĉ",claim:"Разрыв между оптимальной и равновесной связностью получил денежную меру — минимальные затраты механизма Z_min(C̃), при которых равновесие достигает уровня C̃. Целевая связность Ĉ максимизирует Π(C̃) − Z_min(C̃) и может лежать ниже оптимума: последние связи обходятся бюджету дороже, чем приносят сети.",where:"§ 3.2.3; формулы (3.22)–(3.23); вывод 2 по главе 3",prior:"Разрыв эффективности известен в экономике энергосбережения (Gerarden, Newell, Stavins); порог полезности платформы симбиоза показан на агентной модели (Fraccascia).",diff:"Разрыв выражен в рублях бюджетной поддержки, а не в доле неосвоенного потенциала; из (3.23) следует вывод, недоступный в постановке главы 2: добиваться C* не всегда нужно.",check:"На графике справа максимум разности Π(Ĉ) − Z_min(Ĉ) задаёт Ĉ; при росте τ максимум смещается влево от C*."},N3:{tag:"Н3",level:"N",tab:"bilevel",title:"Риск остановки якоря в распределении эффекта и критическая доля зависимости резидента",claim:"Вектор Шепли скорректирован на вероятность остановки якоря π_A: доля якоря уменьшается в (1 − π_A) раз, выигрывают участники с резервными связями. Норма 50 % сопоставлена с критической долей зависимости λ*_j = 1 − FC_j/(m_j·R_j): для низкомаржинальных резидентов норма мягка, для высокомаржинальных жёстка.",where:"§ 3.2.4; формулы (3.24)–(3.27); вывод 2 по главе 3",prior:"Вектор Шепли и ядро с поправкой на риск остановки применялись к межзаводской теплоинтеграции трёх заводов (Jin, Li, Jiang; Jin, Chang и др.).",diff:"Поправка перенесена на игру пяти участников с якорем-болваном в игре v₋A и соединена с регуляторной нормой ТОСЭР; получено проверяемое по отчётности резидентов условие (3.27).",check:"На основной вкладке меняйте m_j и FC_j/R_j: λ*_j переходит через 0,5, и вывод о норме меняется. Во вкладке модели таблица поставщиков показывает λ*_j по каждому резиденту."},N4:{tag:"Н4",level:"N",tab:"simulation",title:"Экономическая граница состояний экосистемы — порог окупаемости платформы C_min",claim:"Три состояния экосистемы, выделявшиеся сценарно, получили экономическое содержание. Граница переходного и экосистемного состояний задаётся порогом C_min = −ln(1 − Z_пл/ΣE)/k; он снижается с 0,089 в 2027 г. до 0,062 в 2036 г. Переходное состояние — зона, где платформа уже несёт затраты, а связей недостаточно для их возмещения.",where:"§ 3.3.2; формула (3.34); вывод 3 по главе 3",prior:"Стадии развития эко-индустриальных парков описывались качественно или по пороговым долям связей; в главе 2 пороги состояний (5 и 15 %) заданы сценарно.",diff:"Порог выведен из модели: постоянные затраты платформы не умножаются на φ, поэтому ниже C_min эффект отрицателен при любом распределении. Сценарная шкала и экономическая граница расходятся, и это показано в табл. 3.10.",check:"Сдвигайте «Связность C_инд»: ΔE(t) меняет знак ровно в точке C_min. Смена k или года прогноза перемещает порог."},N5:{tag:"Н5",level:"N",tab:"bilevel",title:"Сравнение механизмов: компенсация затрат подключения против дивиденда",claim:"При равновесной связности 0,17–0,21 дополнительный эффект платформы составляет 40–78 млн руб. в год, а не 117,4 млн руб. полной реализации. Дивиденд почти не влияет на участие резидентов; компенсация 30 % затрат подключения добавляет четырёх участников при бюджетных затратах около 2,6 млн руб. в год и повышает устойчивость эффекта к опасностям.",where:"§ 3.2.3, 3.3.3–3.3.4; вывод 5 по главе 3",prior:"Экологический налог как инструмент согласования спроса и предложения отходов в цепи симбиоза (Dong, Liu, Zhao); обучение кооперации при стабильных правилах раздела выгод (Yazan и др.).",diff:"Механизмы сравниваются по одному критерию W = Π(C**) − Z в равновесии, а не при заданной связности; устойчивость выбора проверена методом Монте-Карло при разных моделях поведения резидентов.",check:"Нажмите «Монте-Карло»: доля испытаний, где лидирует компенсация σ, выше, чем у дивиденда, при всех моделях поведения. В симуляторе 200 испытаний для скорости; в главе — 25 000."},N6:{tag:"Н6",level:"N",tab:"benef",title:"Баланс бенефициаров и источник ликвидации накопленного ущерба",claim:"Дивиденд не покрывает потребность в ликвидации накопленного ущерба ни при одном сочетании параметров: внешний источник должен давать 86–91 % средств. Основной выигрыш получают резиденты ТОСЭР, основной проигравший — бюджет города, теряющий плату за НВОС, которая направляется на ликвидацию вреда; механизм обязан замещать этот источник.",where:"§ 3.3.5; условие (3.21); вывод 6 по главе 3",prior:"Распределение выгод симбиоза обычно рассматривается между предприятиями; бюджетные последствия и целевой характер платы за НВОС в моделях эко-индустриальных парков не учитывались.",diff:"Построен замыкаемый баланс Σ = ΔE − ΔНВОС с разнесением по бюджетам федерального, краевого и городского уровней и проверкой замыкания в каждом году.",check:"Во вкладке «Бенефициары и стратегии» строка проверки замыкания равна нулю в каждом году; бюджет города получает отрицательный итог. На основной вкладке условие «2. Бюджет» не выполняется при B_внеш = 0."},A1:{tag:"А1",level:"A",tab:"simulation",title:"Калибровка закрытых параметров якоря по 19 азотным комплексам-аналогам",claim:"Параметры, которые «Азот» не раскрывает, откалиброваны по открытой отчётности 19 интегрированных азотных комплексов США; перенос ограничен относительной динамикой и удельными показателями, каждому параметру присвоен класс качества. Эффект засчитывается только для прироста продаж CO₂ сверх 32 тыс. т, углеродная часть по правилам CBAM равна нулю.",where:"§ 3.1; формулы (3.1)–(3.12); вывод 1 по главе 3",prior:"Перенос показателей с аналогов и классы качества данных — известная практика оценки при закрытой отчётности.",diff:"Правила переноса сформулированы для якорного предприятия моногорода; получены ряды 2017–2026 гг. и вывод, что обмены CO₂ ограничены спросом, а не предложением.",check:"Переключите очистку N₂O (вариант A / B): ряды и граница учёта меняются, а состав ΔE_base — нет, поскольку μ = 0."},A2:{tag:"А2",level:"A",tab:"bilevel",title:"Поправка эффекта платформы на эффект отдачи",claim:"Если платформа увеличивает выпуск якоря, сокращение выбросов может быть съедено ростом производства; выведено условие (3.29), при котором чистое изменение выбросов отрицательно, и скорректированный эффект (3.30).",where:"§ 3.2.5;

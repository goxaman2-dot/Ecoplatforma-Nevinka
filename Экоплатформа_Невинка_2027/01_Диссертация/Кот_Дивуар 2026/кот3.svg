<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1080" viewBox="0 0 1520 1080">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#333"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>

    <style>
      .title { font: 700 24px "Times New Roman", serif; fill: #111; }
      .subtitle { font: 400 14px "Times New Roman", serif; fill: #222; }
      .h { font: 700 15px "Times New Roman", serif; fill: #111; }
      .t { font: 400 13px "Times New Roman", serif; fill: #111; }
      .small { font: 400 11px "Times New Roman", serif; fill: #111; }
      .t13 { font: 400 12px "Times New Roman", serif; fill: #111; }
      .t12 { font: 400 11px "Times New Roman", serif; fill: #111; }
      .h15 { font: 700 14px "Times New Roman", serif; fill: #111; }
      .h14 { font: 700 13px "Times New Roman", serif; fill: #111; }

      .box { fill: #fff; stroke: #333; stroke-width: 2; rx: 14; ry: 14; }
      .soft { fill: #fafafa; stroke: #444; stroke-width: 2; rx: 14; ry: 14; }
      .zone { fill: #f7f7f7; stroke: #555; stroke-width: 2; rx: 22; ry: 22; }
      .note { fill: #fff; stroke: #777; stroke-width: 1.6; rx: 12; ry: 12; }
      .chip { fill: #fff; stroke: #666; stroke-width: 1.6; rx: 12; ry: 12; }
      .danger { fill: #fff; stroke: #8a2d2d; stroke-width: 2; rx: 14; ry: 14; }
      .accent { fill: #fff; stroke: #1a4b7a; stroke-width: 2; rx: 14; ry: 14; }
      .accent2 { fill: #fff; stroke: #2f6b2f; stroke-width: 2; rx: 14; ry: 14; }
      .accent3 { fill: #fff; stroke: #7a5a1a; stroke-width: 2; rx: 14; ry: 14; }

      .arrow { stroke: #333; stroke-width: 2.1; fill: none; marker-end: url(#arr); }
      .arrowL { stroke: #666; stroke-width: 1.9; fill: none; marker-end: url(#arrL); }
    </style>
  </defs>

  <!-- Header -->
  <text x="40" y="50" class="title">Философия фронтира: цифровая культура ↔ адаптация общества ↔</text>
  <text x="40" y="75" class="title">рост благосостояния (через предпринимательство)</text>
  <text x="40" y="100" class="subtitle">Вариант С: "palabre" как технология слушания и примирения; фронтир регулирует внедрение</text>
  <text x="40" y="116" class="subtitle">цифровой культуры через рост предпринимательской активности и благосостояния.</text>

  <!-- Left: Platform of state regulation -->
  <rect x="40" y="150" width="400" height="320" class="box"/>
  <text x="60" y="180" class="h">Платформа государственного</text>
  <text x="60" y="198" class="h">регулирования</text>
  <text x="60" y="228" class="t">• Нормы, право, стандарты</text>
  <text x="60" y="250" class="t">• Институты: образование, занятость,</text>
  <text x="70" y="268" class="t">финансы</text>
  <text x="60" y="290" class="t">• Защита прав, "красные линии"</text>
  <text x="70" y="308" class="t">(запрет насилия)</text>
  <text x="60" y="330" class="t">• Инструменты: стимулы, ограничения,</text>
  <text x="70" y="348" class="t">услуги</text>
  <text x="60" y="380" class="small">Роль: рамка, безопасность,</text>
  <text x="60" y="396" class="small">предсказуемость</text>

  <!-- Right: Entrepreneurship platform -->
  <rect x="1080" y="150" width="400" height="320" class="box"/>
  <text x="1100" y="180" class="h">Платформа предпринимательства</text>
  <text x="1100" y="210" class="t">• МСП, самозанятость, кооперации</text>
  <text x="1100" y="232" class="t">• Цифровые сервисы: платежи,</text>
  <text x="1110" y="250" class="t">торговля, логистика</text>
  <text x="1100" y="272" class="t">• Новые практики труда и обмена</text>
  <text x="1100" y="294" class="t">• Канал роста доходов и доверия</text>
  <text x="1100" y="326" class="small">Роль: экономическая интеграция</text>
  <text x="1100" y="342" class="small">и благосостояние</text>

  <!-- Cultural base -->
  <rect x="1080" y="490" width="400" height="110" class="soft"/>
  <text x="1100" y="518" class="h">Социально-культурная основа</text>
  <text x="1100" y="536" class="h">(общество)</text>
  <text x="1100" y="562" class="t">• Общинность, устная традиция,</text>
  <text x="1110" y="580" class="t">контекстность</text>

  <!-- Center: Frontier Zone -->
  <rect x="465" y="140" width="590" height="760" class="zone"/>
  <text x="485" y="170" class="h">Фронтир (адаптационный контур)</text>
  <text x="485" y="192" class="t13">Регулирует воздействие цифровой культуры: снижает</text>
  <text x="485" y="208" class="t13">риски взаимопроникновения и поддерживает рост</text>
  <text x="485" y="224" class="t13">благосостояния через предпринимательство</text>

  <!-- Three core factors -->
  <rect x="495" y="250" width="175" height="85" class="accent"/>
  <text x="515" y="278" class="h15">Фактор 1</text>
  <text x="515" y="300" class="t">Риск</text>
  <text x="515" y="318" class="t12">(вероятность × ущерб)</text>

  <rect x="680" y="250" width="165" height="85" class="accent"/>
  <text x="700" y="278" class="h15">Фактор 2</text>
  <text x="700" y="300" class="t">Бюджет</text>
  <text x="700" y="318" class="t12">(ресурсное</text>
  <text x="700" y="332" class="t12">ограничение)</text>

  <rect x="855" y="250" width="180" height="85" class="accent"/>
  <text x="875" y="278" class="h15">Фактор 3</text>
  <text x="875" y="300" class="t">Фронтир</text>
  <text x="875" y="318" class="t12">(новизна/</text>
  <text x="875" y="332" class="t12">неопределённость)</text>

  <!-- Frontier functions -->
  <rect x="495" y="360" width="540" height="170" class="soft"/>
  <text x="515" y="388" class="h">Функции фронтира</text>

  <rect x="515" y="405" width="155" height="110" class="chip"/>
  <text x="530" y="428" class="h14">Регистрация</text>
  <text x="530" y="448" class="t12">Где растёт</text>
  <text x="530" y="463" class="t12">напряжение?</text>
  <text x="530" y="478" class="t12">Какие разрывы</text>
  <text x="530" y="493" class="t12">в институтах</text>

  <rect x="690" y="405" width="155" height="110" class="chip"/>
  <text x="705" y="428" class="h14">Перевод</text>
  <text x="705" y="448" class="t12">Гибридные</text>
  <text x="705" y="463" class="t12">институты</text>
  <text x="705" y="478" class="t12">и практики</text>
  <text x="705" y="493" class="t12">совместимости</text>

  <rect x="865" y="405" width="155" height="110" class="chip"/>
  <text x="880" y="428" class="h14">Темп</text>
  <text x="880" y="448" class="t12">Управление</text>
  <text x="880" y="463" class="t12">скоростью</text>
  <text x="880" y="478" class="t12">и пределом</text>
  <text x="880" y="493" class="t12">внедрения</text>

  <!-- Palabre block -->
  <rect x="495" y="550" width="540" height="210" class="accent2"/>
  <text x="515" y="578" class="h">Палабр-контур (palabre): публичное</text>
  <text x="515" y="594" class="h">слушание и примирение</text>
  <text x="515" y="618" class="t13">Решение возникает как восстановление согласия</text>
  <text x="515" y="634" class="t13">(а не как "вердикт"):</text>
  <text x="515" y="656" class="t12">• слушание нарративов и признание мотивов</text>
  <text x="515" y="674" class="t12">• признание ущерба: символического</text>
  <text x="525" y="688" class="t12">и практического</text>
  <text x="515" y="706" class="t12">• выработка консенсуса и локальная</text>
  <text x="525" y="720" class="t12">легитимация</text>
  <text x="515" y="738" class="t12">• настройка темпа/пределов внедрения</text>
  <text x="525" y="752" class="t12">и распределения выгод</text>

  <!-- Metrics panel -->
  <rect x="495" y="780" width="540" height="110" class="note"/>
  <text x="515" y="808" class="h">Метрики фронтира</text>
  <text x="515" y="830" class="t13">По природе несовершенны: используются как сигналы</text>
  <text x="515" y="846" class="t13">(раннее обнаружение), а не как "судебные</text>
  <text x="515" y="862" class="t13">доказательства"; требуют интерпретации</text>
  <text x="515" y="878" class="t13">и согласования в палабр-контуре</text>

  <!-- Left: Risk factors -->
  <rect x="40" y="490" width="400" height="410" class="soft"/>
  <text x="60" y="518" class="h">Риски фронтира</text>
  <text x="60" y="534" class="h">(болезненность процесса)</text>
  <text x="60" y="560" class="t">• Несовпадение когнитивных режимов</text>
  <text x="70" y="578" class="t">и кодов обучения</text>
  <text x="60" y="600" class="t">• Институциональные разрывы (школа,</text>
  <text x="70" y="618" class="t">рынок труда, финансы)</text>
  <text x="60" y="640" class="t">• Темп внедрения &gt; темпа адаптации</text>
  <text x="70" y="658" class="t">практик</text>
  <text x="60" y="680" class="t">• Нормативное сопротивление</text>
  <text x="70" y="698" class="t">и недоверие к институтам</text>
  <text x="60" y="720" class="t">• Уход в теневые практики</text>
  <text x="70" y="738" class="t">и неформальные посредники</text>
  <text x="60" y="760" class="t">• Эскалация из-за "метрик-вердиктов"</text>
  <text x="70" y="778" class="t">и санкционной логики</text>
  <text x="60" y="808" class="small">Смысл: риск — в несостыковке систем;</text>
  <text x="60" y="824" class="small">"когнитивные слабости" проявляются</text>
  <text x="60" y="840" class="small">как структурная несовместимость</text>

  <!-- Right: Outcomes -->
  <rect x="1080" y="620" width="400" height="280" class="accent3"/>
  <text x="1100" y="650" class="h">Целевой эффект (выход фронтира)</text>
  <text x="1100" y="678" class="t">• Рост предпринимательской</text>
  <text x="1110" y="696" class="t">активности</text>
  <text x="1100" y="718" class="t">• Рост доходов и благосостояния</text>
  <text x="1100" y="740" class="t">• Рост доверия к институтам</text>
  <text x="1110" y="758" class="t">(через результат)</text>
  <text x="1100" y="780" class="t">• Снижение остроты культурных</text>
  <text x="1110" y="798" class="t">конфликтов</text>
  <text x="1100" y="828" class="small">Принцип: платформа учится культуре</text>
  <text x="1100" y="844" class="small">быстрее, чем культура — платформе;</text>
  <text x="1100" y="860" class="small">выгоды распределяются прозрачно</text>

  <!-- Arrows -->
  <path class="arrow" d="M440,310 C480,310 470,310 495,310"/>
  <path class="arrow" d="M1080,310 C1040,310 1050,310 1035,310"/>
  <path class="arrowL" d="M1080,545 C1010,580 980,590 1035,620"/>
  <path class="arrowL" d="M250,490 C420,450 460,440 495,445"/>
  <path class="arrow" d="M582,335 C582,351 582,354 582,360"/>
  <path class="arrow" d="M762,335 C762,351 762,354 762,360"/>
  <path class="arrow" d="M945,335 C945,351 945,354 945,360"/>
  <path class="arrowL" d="M765,530 C765,542 765,540 765,550"/>
  <path class="arrowL" d="M765,760 C765,772 765,771 765,780"/>
  <path class="arrow" d="M1055,720 C1080,720 1070,720 1080,720"/>

  <!-- Bottom synthesis -->
  <rect x="40" y="920" width="1440" height="140" class="danger"/>
  <text x="60" y="952" class="h">Синтез</text>
  <text x="60" y="976" class="t13">Фронтир регулирует внедрение цифровой культуры не напрямую, а через экономический канал:</text>
  <text x="60" y="992" class="t13">предпринимательство → рост благосостояния → рост доверия. Процесс болезненный из-за структурной</text>
  <text x="60" y="1008" class="t13">когнитивной несовместимости и институциональных разрывов; "палабр-контур" обеспечивает примирение</text>
  <text x="60" y="1024" class="t13">и настройку темпа/пределов внедрения. Метрики выполняют сигнальную функцию и требуют интерпретации:</text>
  <text x="60" y="1040" class="t13">они не "судебные доказательства", а индикаторы для коррекции траектории.</text>
</svg>
<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1500" height="750" viewBox="0 0 1500 750" xmlns="http://www.w3.org/2000/svg">

  <style>
    .cluster {
      fill: #f5f5f5;
      stroke: #333333;
      stroke-width: 1.5;
      rx: 10;
      ry: 10;
    }
    .core {
      fill: #e0f0ff;
      stroke: #004b80;
      stroke-width: 2;
      rx: 15;
      ry: 15;
    }
    .label {
      font-family: "Times New Roman", "DejaVu Sans", Arial;
      font-size: 16px;
      fill: #000000;
    }
    .small { font-size: 14px; }
    .arrow {
      stroke: #555555;
      stroke-width: 1.5;
      fill: none;
      marker-end: url(#arrowhead);
    }
    .arrow-bold {
      stroke: #004b80;
      stroke-width: 2.5;
      fill: none;
      marker-end: url(#arrowhead-bold);
    }
    .output-box {
      fill: #e8ffe8;
      stroke: #2f6b2f;
      stroke-width: 2;
      rx: 12;
      ry: 12;
    }
    .formula-inline {
      font-family: "Cambria Math", "Cambria", "Times New Roman", serif;
      font-size: 13px;
      font-style: italic;
      fill: #000000;
    }
  </style>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555" />
    </marker>
    <marker id="arrowhead-bold" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#004b80" />
    </marker>
  </defs>

  <!-- Core platform (уменьшенный) -->
  <rect class="core" x="450" y="260" width="300" height="200" />
  <text class="label" x="600" y="295" text-anchor="middle">
    Цифровая платформа «Берег Восхода»
  </text>
  <text class="label small" x="600" y="317" text-anchor="middle">
    Кластер IV — данные, API, мониторинг, управление
  </text>
  <text class="formula-inline" x="600" y="338" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">4</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">4</tspan>, I<tspan baseline-shift="sub" font-size="11">4</tspan>, Land<tspan baseline-shift="sub" font-size="11">4</tspan>, En<tspan baseline-shift="sub" font-size="11">4</tspan>, HR<tspan baseline-shift="sub" font-size="11">4</tspan></tspan>
  </text>
  <text class="formula-inline" x="600" y="356" text-anchor="middle">
    <tspan>ограничения: 0 ≤ x<tspan baseline-shift="sub" font-size="11">4</tspan> ≤ 1</tspan>
  </text>

  <!-- Surrounding clusters: симметричное расположение вокруг платформы -->
  <!-- Верхний ряд (7,6,5) -->
  <rect class="cluster" x="220" y="80" width="240" height="110" />
  <text class="label" x="340" y="110" text-anchor="middle">
    Кластер VII
  </text>
  <text class="label small" x="340" y="130" text-anchor="middle">
    Финансово-инвестиционный
  </text>
  <text class="formula-inline" x="340" y="150" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">7</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">7</tspan>, I<tspan baseline-shift="sub" font-size="11">7</tspan></tspan>
  </text>
  <text class="formula-inline" x="340" y="168" text-anchor="middle">
    <tspan>ограничения: 0 ≤ x<tspan baseline-shift="sub" font-size="11">7</tspan> ≤ 1</tspan>
  </text>

  <rect class="cluster" x="480" y="60" width="240" height="110" />
  <text class="label" x="600" y="90" text-anchor="middle">
    Кластер VI
  </text>
  <text class="label small" x="600" y="110" text-anchor="middle">
    Энергетический и ESG
  </text>
  <text class="formula-inline" x="600" y="130" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">6</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">6</tspan>, I<tspan baseline-shift="sub" font-size="11">6</tspan></tspan>
  </text>
  <text class="formula-inline" x="600" y="148" text-anchor="middle">
    <tspan>ограничения: x<tspan baseline-shift="sub" font-size="11">6</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">6</tspan><tspan baseline-shift="super" font-size="11">min</tspan></tspan>
  </text>

  <rect class="cluster" x="740" y="80" width="240" height="110" />
  <text class="label" x="860" y="110" text-anchor="middle">
    Кластер V
  </text>
  <text class="label small" x="860" y="130" text-anchor="middle">
    Образование и R&amp;D
  </text>
  <text class="formula-inline" x="860" y="150" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">5</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">5</tspan>, I<tspan baseline-shift="sub" font-size="11">5</tspan></tspan>
  </text>
  <text class="formula-inline" x="860" y="168" text-anchor="middle">
    <tspan>ограничения: x<tspan baseline-shift="sub" font-size="11">5</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">5</tspan><tspan baseline-shift="super" font-size="11">min</tspan></tspan>
  </text>

  <!-- Левый столбец (1,2,3) -->
  <rect class="cluster" x="140" y="250" width="240" height="110" />
  <text class="label" x="260" y="278" text-anchor="middle">
    Кластер I — Агропереработка
  </text>
  <text class="label small" x="260" y="298" text-anchor="middle">
    Какао и агроэкспорт
  </text>
  <text class="formula-inline" x="260" y="318" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">1</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">1</tspan></tspan>
  </text>
  <text class="formula-inline" x="260" y="336" text-anchor="middle">
    <tspan>ограничения: 0 ≤ x<tspan baseline-shift="sub" font-size="11">1</tspan> ≤ 1</tspan>
  </text>

  <rect class="cluster" x="140" y="370" width="240" height="110" />
  <text class="label" x="260" y="398" text-anchor="middle">
    Кластер II — Порт и логистика
  </text>
  <text class="label small" x="260" y="418" text-anchor="middle">
    Транзит, экспорт, импорт
  </text>
  <text class="formula-inline" x="260" y="438" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">2</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">2</tspan></tspan>
  </text>
  <text class="formula-inline" x="260" y="456" text-anchor="middle">
    <tspan>ограничения: 0 ≤ x<tspan baseline-shift="sub" font-size="11">2</tspan> ≤ 1</tspan>
  </text>

  <rect class="cluster" x="140" y="490" width="240" height="110" />
  <text class="label" x="260" y="518" text-anchor="middle">
    Кластер III — СЭЗ и индустрия
  </text>
  <text class="label small" x="260" y="538" text-anchor="middle">
    Обрабатывающая промышленность
  </text>
  <text class="formula-inline" x="260" y="558" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">3</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">3</tspan></tspan>
  </text>
  <text class="formula-inline" x="260" y="576" text-anchor="middle">
    <tspan>ограничения: 0 ≤ x<tspan baseline-shift="sub" font-size="11">3</tspan> ≤ 1</tspan>
  </text>

  <!-- Нижний ряд (8,9) -->
  <rect class="cluster" x="380" y="520" width="240" height="110" />
  <text class="label" x="500" y="548" text-anchor="middle">
    Кластер VIII
  </text>
  <text class="label small" x="500" y="568" text-anchor="middle">
    Социальный и урбанистический
  </text>
  <text class="formula-inline" x="500" y="588" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">8</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">8</tspan></tspan>
  </text>
  <text class="formula-inline" x="500" y="606" text-anchor="middle">
    <tspan>ограничения: 0 ≤ x<tspan baseline-shift="sub" font-size="11">8</tspan> ≤ 1</tspan>
  </text>

  <rect class="cluster" x="640" y="520" width="240" height="110" />
  <text class="label" x="760" y="548" text-anchor="middle">
    Кластер IX
  </text>
  <text class="label small" x="760" y="568" text-anchor="middle">
    Экологический и климатический
  </text>
  <text class="formula-inline" x="760" y="588" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">9</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">9</tspan></tspan>
  </text>
  <text class="formula-inline" x="760" y="606" text-anchor="middle">
    <tspan>ограничения: 0 ≤ x<tspan baseline-shift="sub" font-size="11">9</tspan> ≤ 1</tspan>
  </text>

  <!-- Output box -->
  <rect class="output-box" x="950" y="260" width="260" height="200" />
  <text class="label" x="1080" y="295" text-anchor="middle">
    Интегральный эффект
  </text>
  <text class="label small" x="1080" y="318" text-anchor="middle">
    ΔВВП, ΔL, ΔS, ΔE
  </text>
  <text class="formula-inline" x="1080" y="342" text-anchor="middle">
    <tspan>F(x) = w<tspan baseline-shift="sub" font-size="11">Y</tspan>·(ΔY/Y<tspan baseline-shift="sub" font-size="11">0</tspan>)</tspan>
  </text>
  <text class="formula-inline" x="1080" y="362" text-anchor="middle">
    <tspan>+ w<tspan baseline-shift="sub" font-size="11">L</tspan>·(ΔL/L<tspan baseline-shift="sub" font-size="11">0</tspan>) + w<tspan baseline-shift="sub" font-size="11">S</tspan>·ΔS</tspan>
  </text>
  <text class="formula-inline" x="1080" y="382" text-anchor="middle">
    <tspan>− w<tspan baseline-shift="sub" font-size="11">E</tspan>·ΔE − w<tspan baseline-shift="sub" font-size="11">R</tspan>·R<tspan baseline-shift="sub" font-size="11">Σ</tspan></tspan>
  </text>

  <!-- Arrows from clusters to platform -->
  <!-- Top to core -->
  <line class="arrow" x1="340" y1="190" x2="520" y2="260" />
  <line class="arrow" x1="600" y1="170" x2="600" y2="260" />
  <line class="arrow" x1="860" y1="190" x2="680" y2="260" />

  <!-- Left to core -->
  <line class="arrow" x1="380" y1="305" x2="450" y2="305" />
  <line class="arrow" x1="380" y1="425" x2="450" y2="330" />
  <line class="arrow" x1="380" y1="545" x2="450" y2="355" />

  <!-- Bottom to core -->
  <line class="arrow" x1="500" y1="520" x2="560" y2="460" />
  <line class="arrow" x1="760" y1="520" x2="640" y2="460" />

  <!-- Core to output (bold arrow) -->
  <line class="arrow-bold" x1="750" y1="360" x2="950" y2="360" />

  <!-- Caption -->
  <text class="label small" x="750" y="730" text-anchor="middle">
    Рисунок 3.3.1 – Платформенная архитектура кластеров проекта «Берег Восхода» с целевыми параметрами и ограничениями по каждому кластеру и интегральной функцией F(x).
  </text>

</svg>

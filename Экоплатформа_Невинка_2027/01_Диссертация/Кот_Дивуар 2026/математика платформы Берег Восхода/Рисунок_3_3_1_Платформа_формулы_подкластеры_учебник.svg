  </text>
  <text class="formula-inline" x="190" y="395" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">2</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">2</tspan>, I<tspan baseline-shift="sub" font-size="11">2</tspan>, Land<tspan baseline-shift="sub" font-size="11">2</tspan>, En<tspan baseline-shift="sub" font-size="11">2</tspan>, HR<tspan baseline-shift="sub" font-size="11">2</tspan></tspan>
  </text>
  <text class="formula-inline" x="190" y="413" text-anchor="middle">
    <tspan>0 ≤ x<tspan baseline-shift="sub" font-size="11">2</tspan> ≤ 1;  x<tspan baseline-shift="sub" font-size="11">2</tspan>·I<tspan baseline-shift="sub" font-size="11">2</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">2</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <rect class="cluster" x="60" y="450" width="260" height="100" />
  <text class="label" x="190" y="475" text-anchor="middle">
    Кластер III — СЭЗ и индустрия
  </text>
  <text class="label small" x="190" y="495" text-anchor="middle">
    Обрабатывающая промышленность
  </text>
  <text class="formula-inline" x="190" y="515" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">3</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">3</tspan>, I<tspan baseline-shift="sub" font-size="11">3</tspan>, Land<tspan baseline-shift="sub" font-size="11">3</tspan>, En<tspan baseline-shift="sub" font-size="11">3</tspan>, HR<tspan baseline-shift="sub" font-size="11">3</tspan></tspan>
  </text>
  <text class="formula-inline" x="190" y="533" text-anchor="middle">
    <tspan>0 ≤ x<tspan baseline-shift="sub" font-size="11">3</tspan> ≤ 1;  x<tspan baseline-shift="sub" font-size="11">3</tspan>·I<tspan baseline-shift="sub" font-size="11">3</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">3</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <!-- Bottom row -->
  <rect class="cluster" x="260" y="570" width="260" height="100" />
  <text class="label" x="390" y="595" text-anchor="middle">
    Кластер VIII
  </text>
  <text class="label small" x="390" y="615" text-anchor="middle">
    Социальный и урбанистический
  </text>
  <text class="formula-inline" x="390" y="635" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">8</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">8</tspan>, I<tspan baseline-shift="sub" font-size="11">8</tspan>, Land<tspan baseline-shift="sub" font-size="11">8</tspan>, En<tspan baseline-shift="sub" font-size="11">8</tspan>, HR<tspan baseline-shift="sub" font-size="11">8</tspan></tspan>
  </text>
  <text class="formula-inline" x="390" y="653" text-anchor="middle">
    <tspan>0 ≤ x<tspan baseline-shift="sub" font-size="11">8</tspan> ≤ 1;  x<tspan baseline-shift="sub" font-size="11">8</tspan>·I<tspan baseline-shift="sub" font-size="11">8</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">8</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <rect class="cluster" x="620" y="570" width="260" height="100" />
  <text class="label" x="750" y="595" text-anchor="middle">
    Кластер IX
  </text>
  <text class="label small" x="750" y="615" text-anchor="middle">
    Экологический и климатический
  </text>
  <text class="formula-inline" x="750" y="635" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">9</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">9</tspan>, I<tspan baseline-shift="sub" font-size="11">9</tspan>, Land<tspan baseline-shift="sub" font-size="11">9</tspan>, En<tspan baseline-shift="sub" font-size="11">9</tspan>, HR<tspan baseline-shift="sub" font-size="11">9</tspan></tspan>
  </text>
  <text class="formula-inline" x="750" y="653" text-anchor="middle">
    <tspan>0 ≤ x<tspan baseline-shift="sub" font-size="11">9</tspan> ≤ 1;  x<tspan baseline-shift="sub" font-size="11">9</tspan>·I<tspan baseline-shift="sub" font-size="11">9</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">9</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <!-- Output box -->
  <rect class="output-box" x="900" y="240" width="260" height="220" />
  <text class="label" x="1030" y="270" text-anchor="middle">
    Интегральный эффект
  </text>
  <text class="label small" x="1030" y="295" text-anchor="middle">
    ΔВВП, ΔL, ΔS, ΔE
  </text>
  <text class="formula-inline" x="1030" y="320" text-anchor="middle">
    <tspan>F(x) = w<tspan baseline-shift="sub" font-size="11">Y</tspan>·(ΔY/Y<tspan baseline-shift="sub" font-size="11">0</tspan>)</tspan>
  </text>
  <text class="formula-inline" x="1030" y="340" text-anchor="middle">
    <tspan>+ w<tspan baseline-shift="sub" font-size="11">L</tspan>·(ΔL/L<tspan baseline-shift="sub" font-size="11">0</tspan>) + w<tspan baseline-shift="sub" font-size="11">S</tspan>·ΔS − w<tspan baseline-shift="sub" font-size="11">E</tspan>·ΔE − w<tspan baseline-shift="sub" font-size="11">R</tspan>·R<tspan baseline-shift="sub" font-size="11">Σ</tspan></tspan>
  </text>

  <!-- Arrows from clusters to platform -->
  <!-- Top to core -->
  <line class="arrow" x1="260" y1="150" x2="520" y2="220" />
  <line class="arrow" x1="600" y1="150" x2="600" y2="220" />
  <line class="arrow" x1="940" y1="150" x2="680" y2="220" />

  <!-- Left to core -->
  <line class="arrow" x1="320" y1="260" x2="380" y2="260" />
  <line class="arrow" x1="320" y1="380" x2="380" y2="310" />
  <line class="arrow" x1="320" y1="500" x2="380" y2="360" />

  <!-- Bottom to core -->
  <line class="arrow" x1="390" y1="570" x2="520" y2="480" />
  <line class="arrow" x1="750" y1="570" x2="680" y2="480" />

  <!-- Core to output (bold arrow) -->
  <line class="arrow-bold" x1="820" y1="350" x2="900" y2="350" />

  <!-- Caption -->
  <text class="label small" x="750" y="730" text-anchor="middle">
    Рисунок 3.3.1 – Платформенная архитектура кластеров проекта «Берег Восхода» с кластерными параметрами x_i, ΔY_i, I_i, Land_i, En_i, HR_i и интегральной целевой функцией F(x).
  </text>

</svg>

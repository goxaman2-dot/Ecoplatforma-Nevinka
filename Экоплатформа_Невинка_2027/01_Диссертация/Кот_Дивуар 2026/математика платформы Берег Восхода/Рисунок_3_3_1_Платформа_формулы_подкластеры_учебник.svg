<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1500" height="750" viewBox="0 0 1500 750" xmlns="http://www.w3.org/2000/svg">

  <style>
    .cluster {
      fill: #f5f5f5;
      stroke: #333333;
      stroke-width: 1.5;
      rx: 10;
      ry: 10;
    }
    .core {
      fill: #e0f0ff;
      stroke: #004b80;
      stroke-width: 2;
      rx: 15;
      ry: 15;
    }
    .label {
      font-family: "Times New Roman", "DejaVu Sans", Arial;
      font-size: 16px;
      fill: #000000;
    }
    .small { font-size: 14px; }
    .arrow {
      stroke: #555555;
      stroke-width: 1.5;
      fill: none;
      marker-end: url(#arrowhead);
    }
    .arrow-bold {
      stroke: #004b80;
      stroke-width: 2.5;
      fill: none;
      marker-end: url(#arrowhead-bold);
    }
    .output-box {
      fill: #e8ffe8;
      stroke: #2f6b2f;
      stroke-width: 2;
      rx: 12;
      ry: 12;
    }
    .formula-inline {
      font-family: "Times New Roman", "DejaVu Sans", Arial;
      font-size: 13px;
      font-style: italic;
      fill: #000000;
    }
  </style>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555555" />
    </marker>
    <marker id="arrowhead-bold" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#004b80" />
    </marker>
  </defs>

  <!-- Core platform -->
  <rect class="core" x="380" y="220" width="440" height="260" />
  <text class="label" x="600" y="270" text-anchor="middle">
    Цифровая платформа «Берег Восхода»
  </text>
  <text class="label small" x="600" y="295" text-anchor="middle">
    Кластер IV — данные, API, мониторинг, управление
  </text>
  <text class="formula-inline" x="600" y="320" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">4</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">4</tspan>, I<tspan baseline-shift="sub" font-size="11">4</tspan>, Land<tspan baseline-shift="sub" font-size="11">4</tspan>, En<tspan baseline-shift="sub" font-size="11">4</tspan>, HR<tspan baseline-shift="sub" font-size="11">4</tspan></tspan>
  </text>
  <text class="formula-inline" x="600" y="340" text-anchor="middle">
    <tspan>0 ≤ x<tspan baseline-shift="sub" font-size="11">4</tspan> ≤ 1;  x<tspan baseline-shift="sub" font-size="11">4</tspan>·I<tspan baseline-shift="sub" font-size="11">4</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">4</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <!-- Surrounding clusters -->

  <!-- Top row -->
  <rect class="cluster" x="140" y="50" width="240" height="100" />
  <text class="label" x="260" y="80" text-anchor="middle">
    Кластер VII
  </text>
  <text class="label small" x="260" y="100" text-anchor="middle">
    Финансово-инвестиционный
  </text>
  <text class="formula-inline" x="260" y="120" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">7</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">7</tspan>, I<tspan baseline-shift="sub" font-size="11">7</tspan>, Land<tspan baseline-shift="sub" font-size="11">7</tspan>, En<tspan baseline-shift="sub" font-size="11">7</tspan>, HR<tspan baseline-shift="sub" font-size="11">7</tspan></tspan>
  </text>
  <text class="formula-inline" x="260" y="138" text-anchor="middle">
    <tspan>0 ≤ x<tspan baseline-shift="sub" font-size="11">7</tspan> ≤ 1;  x<tspan baseline-shift="sub" font-size="11">7</tspan>·I<tspan baseline-shift="sub" font-size="11">7</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">7</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <rect class="cluster" x="480" y="50" width="240" height="100" />
  <text class="label" x="600" y="80" text-anchor="middle">

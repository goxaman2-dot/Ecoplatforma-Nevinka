  </text>
  <text class="label small" x="600" y="100" text-anchor="middle">
    Энергетический и ESG
  </text>
  <text class="formula-inline" x="600" y="120" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">6</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">6</tspan>, I<tspan baseline-shift="sub" font-size="11">6</tspan>, Land<tspan baseline-shift="sub" font-size="11">6</tspan>, En<tspan baseline-shift="sub" font-size="11">6</tspan>, HR<tspan baseline-shift="sub" font-size="11">6</tspan></tspan>
  </text>
  <text class="formula-inline" x="600" y="138" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">6</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">6</tspan><tspan baseline-shift="super" font-size="11">min</tspan>;  x<tspan baseline-shift="sub" font-size="11">6</tspan>·I<tspan baseline-shift="sub" font-size="11">6</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">6</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <rect class="cluster" x="820" y="50" width="240" height="100" />
  <text class="label" x="940" y="80" text-anchor="middle">
    Кластер V
  </text>
  <text class="label small" x="940" y="100" text-anchor="middle">
    Образование и R&amp;D
  </text>
  <text class="formula-inline" x="940" y="120" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">5</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">5</tspan>, I<tspan baseline-shift="sub" font-size="11">5</tspan>, Land<tspan baseline-shift="sub" font-size="11">5</tspan>, En<tspan baseline-shift="sub" font-size="11">5</tspan>, HR<tspan baseline-shift="sub" font-size="11">5</tspan></tspan>
  </text>
  <text class="formula-inline" x="940" y="138" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">5</tspan> ≥ x<tspan baseline-shift="sub" font-size="11">5</tspan><tspan baseline-shift="super" font-size="11">min</tspan>;  x<tspan baseline-shift="sub" font-size="11">5</tspan>·I<tspan baseline-shift="sub" font-size="11">5</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">5</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <!-- Left column -->
  <rect class="cluster" x="60" y="210" width="260" height="100" />
  <text class="label" x="190" y="235" text-anchor="middle">
    Кластер I — Агропереработка
  </text>
  <text class="label small" x="190" y="255" text-anchor="middle">
    Какао и агроэкспорт
  </text>
  <text class="formula-inline" x="190" y="275" text-anchor="middle">
    <tspan>x<tspan baseline-shift="sub" font-size="11">1</tspan>, ΔY<tspan baseline-shift="sub" font-size="11">1</tspan>, I<tspan baseline-shift="sub" font-size="11">1</tspan>, Land<tspan baseline-shift="sub" font-size="11">1</tspan>, En<tspan baseline-shift="sub" font-size="11">1</tspan>, HR<tspan baseline-shift="sub" font-size="11">1</tspan></tspan>
  </text>
  <text class="formula-inline" x="190" y="293" text-anchor="middle">
    <tspan>0 ≤ x<tspan baseline-shift="sub" font-size="11">1</tspan> ≤ 1;  x<tspan baseline-shift="sub" font-size="11">1</tspan>·I<tspan baseline-shift="sub" font-size="11">1</tspan> ≤ I<tspan baseline-shift="sub" font-size="11">1</tspan><tspan baseline-shift="super" font-size="11">max</tspan></tspan>
  </text>

  <rect class="cluster" x="60" y="330" width="260" height="100" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Times New Roman, Liberation Serif, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1100" height="600" fill="#ffffff"/>
<polygon points="110,60 830,60 750,170 190,170" fill="#f2f2f2" stroke="#111111" stroke-width="1.6"/>
<text x="470" y="105.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Технически возможные обмены R<tspan dy="0.35em" font-size="72%">пот</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<text x="470" y="126.96000000000001" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">матрица совместимости a<tspan dy="0.35em" font-size="72%">ij</tspan><tspan dy="-0.252em"></tspan><tspan dy="-0.55em" font-size="72%">k</tspan><tspan dy="0.396em">, формула (1.2)</tspan></text>
<polygon points="190,195 750,195 670,305 270,305" fill="#d9d9d9" stroke="#111111" stroke-width="1.6"/>
<text x="470" y="240.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Экономически обоснованные R<tspan dy="0.35em" font-size="72%">эк</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<text x="470" y="261.96" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">NPV ≥ 0 при цене в коридоре, b<tspan dy="0.35em" font-size="72%">ij</tspan><tspan dy="-0.252em"></tspan><tspan dy="-0.55em" font-size="72%">k</tspan><tspan dy="0.396em">, (1.3)</tspan></text>
<polygon points="270,330 670,330 600,440 340,440" fill="#bfbfbf" stroke="#111111" stroke-width="1.6"/>
<text x="470" y="375.0" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Фактически действующие R<tspan dy="0.35em" font-size="72%">факт</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<text x="470" y="396.96" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">договор и подтверждённый учёт</text>
<path d="M850,115 L870,115 L870,250 L850,250" fill="none" stroke="#111111" stroke-width="1.6"/>
<text x="885" y="158.0" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">η<tspan dy="0.35em" font-size="72%">эк</tspan><tspan dy="-0.252em"> = R</tspan><tspan dy="0.35em" font-size="72%">эк</tspan><tspan dy="-0.252em"> / R</tspan><tspan dy="0.35em" font-size="72%">пот</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<text x="885" y="178.74" font-size="17" text-anchor="start" font-weight="normal" fill="#111111">окупаемость обменов:</text>
<text x="885" y="199.48" font-size="17" text-anchor="start" font-weight="normal" fill="#111111">цена, субсидия,</text>
<text x="885" y="220.22" font-size="17" text-anchor="start" font-weight="normal" fill="#111111">технология</text>
<path d="M850,262 L870,262 L870,385 L850,385" fill="none" stroke="#111111" stroke-width="1.6"/>
<text x="885" y="300.0" font-size="17" text-anchor="start" font-weight="bold" fill="#111111">η<tspan dy="0.35em" font-size="72%">орг</tspan><tspan dy="-0.252em"> = R</tspan><tspan dy="0.35em" font-size="72%">факт</tspan><tspan dy="-0.252em"> / R</tspan><tspan dy="0.35em" font-size="72%">эк</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<text x="885" y="320.74" font-size="17" text-anchor="start" font-weight="normal" fill="#111111">заключение сделок:</text>
<text x="885" y="341.48" font-size="17" text-anchor="start" font-weight="normal" fill="#111111">экоплатформа</text>
<text x="470" y="490" font-size="20" text-anchor="middle" font-weight="bold" fill="#111111">C<tspan dy="0.35em" font-size="72%">инд</tspan><tspan dy="-0.252em"> = R</tspan><tspan dy="0.35em" font-size="72%">факт</tspan><tspan dy="-0.252em"> / R</tspan><tspan dy="0.35em" font-size="72%">пот</tspan><tspan dy="-0.252em"> = η</tspan><tspan dy="0.35em" font-size="72%">эк</tspan><tspan dy="-0.252em"> · η</tspan><tspan dy="0.35em" font-size="72%">орг</tspan><tspan dy="-0.252em">, формула (1.4)</tspan></text>
<line x1="232" y1="250" x2="232" y2="531.74" stroke="#6b6b6b" stroke-width="1.0"/>
<circle cx="232" cy="250" r="3" fill="#111111"/>
<rect x="140" y="531.74" width="614.32" height="26.52" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
<text x="447.16" y="550.44" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">пример (модель, Португалия): 26 допустимых → 12 выбранных маршрутов</text>
</svg>

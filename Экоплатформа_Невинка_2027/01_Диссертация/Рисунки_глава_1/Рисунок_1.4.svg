<text x="530" y="223.36" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">2. Ресурсный</text>
<text x="530" y="245.32000000000002" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">обмен</text>
<text x="530" y="267.28000000000003" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">цена p<tspan dy="0.35em" font-size="72%">ij</tspan><tspan dy="-0.252em">(k),</tspan></text>
<text x="530" y="289.24" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">договор (§ 2.8)</text>
<rect x="665.0" y="175.0" width="190" height="150" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="760" y="223.36" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">3. Информационное</text>
<text x="760" y="245.32000000000002" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">обеспечение</text>
<text x="760" y="267.28000000000003" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">IoT-учёт, аудит,</text>
<text x="760" y="289.24" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">ΔE(t) (§ 2.4)</text>

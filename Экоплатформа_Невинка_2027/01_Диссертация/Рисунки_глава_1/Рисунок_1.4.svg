<text x="1010" y="235.21" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">и его</text>
<text x="1010" y="255.95" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">распределение</text>
<text x="1010" y="276.69" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">γ<tspan dy="0.35em" font-size="72%">g</tspan><tspan dy="-0.252em">, β,</tspan></text>
<text x="1010" y="297.43" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">экофонд</text>
<line x1="855" y1="250" x2="928" y2="250" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>

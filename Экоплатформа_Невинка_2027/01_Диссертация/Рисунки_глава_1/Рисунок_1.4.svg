<text x="330" y="486.32" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">о ГЧП (§ 2.7)</text>
<rect x="420.0" y="433.0" width="150" height="74" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="495" y="465.58" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">Независимый</text>
<text x="495" y="486.32" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">аудит</text>
<rect x="585.0" y="433.0" width="150" height="74" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="660" y="465.58" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">Data Trust</text>
<text x="660" y="486.32" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">(§ 2.9.6)</text>
<rect x="750.0" y="433.0" width="150" height="74" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="825" y="455.21" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">Правило</text>
<text x="825" y="475.95" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">распределения</text>
<text x="825" y="496.69" font-size="17" text-anchor="middle" font-weight="normal" fill="#111111">(§ 2.6)</text>
<text x="530" y="535" font-size="17" text-anchor="middle" font-weight="normal" fill="#6b6b6b" font-style="italic">механизмы охватывают все три функции</text>

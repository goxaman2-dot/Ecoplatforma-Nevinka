<text x="300" y="223.36" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">1. Координация</text>
<text x="300" y="245.32000000000002" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">подбор пар</text>
<text x="300" y="267.28000000000003" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">по матрице a<tspan dy="0.35em" font-size="72%">ij</tspan><tspan dy="-0.252em"></tspan><tspan dy="-0.55em" font-size="72%">k</tspan><tspan dy="0.396em">&#8203;</tspan></text>
<text x="300" y="289.24" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">(§ 2.2.3)</text>

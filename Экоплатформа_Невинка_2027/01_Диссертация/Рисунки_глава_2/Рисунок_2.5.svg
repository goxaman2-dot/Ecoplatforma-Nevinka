<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Times New Roman, Liberation Serif, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1100" height="640" fill="#ffffff"/>
<rect x="40.0" y="48.0" width="260" height="84" rx="6" fill="#f2f2f2" stroke="#111111" stroke-width="1.6"/>
<text x="170" y="85.32" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">Есть сопоставимый</text>
<text x="170" y="107.28" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">рынок или тариф?</text>
<rect x="40.0" y="238.0" width="260" height="84" rx="6" fill="#f2f2f2" stroke="#111111" stroke-width="1.6"/>
<text x="170" y="275.32" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">Затраты поставщика</text>
<text x="170" y="297.28" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">подтверждаются?</text>
<rect x="40.0" y="428.0" width="260" height="84" rx="6" fill="#f2f2f2" stroke="#111111" stroke-width="1.6"/>
<text x="170" y="465.32" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">Есть регуляторная</text>
<text x="170" y="487.28" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">ставка платы?</text>
<line x1="170" y1="132" x2="170" y2="238" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="185" y="190" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b6b">нет</text>
<line x1="170" y1="322" x2="170" y2="428" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="185" y="380" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b6b">нет</text>
<rect x="410.0" y="52.0" width="300" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="560" y="85.32" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Рыночный аналог (MB)</text>
<text x="560" y="107.28" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">p = P<tspan dy="0.35em" font-size="72%">ref</tspan><tspan dy="-0.252em"> − δ</tspan><tspan dy="0.35em" font-size="72%">trans</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<rect x="410.0" y="242.0" width="300" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="560" y="275.32" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Затраты плюс (CP)</text>
<text x="560" y="297.28" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">p = C<tspan dy="0.35em" font-size="72%">ij</tspan><tspan dy="-0.252em"> · (1 + m)</tspan></text>
<rect x="410.0" y="432.0" width="300" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="560" y="465.32" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Теневая оценка (SP)</text>
<text x="560" y="487.28" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">вне цены сделки</text>
<rect x="410.0" y="552.0" width="300" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="560" y="585.3199999999999" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Переговорная цена (NP)</text>
<text x="560" y="607.28" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">p<tspan dy="0.35em" font-size="72%">min</tspan><tspan dy="-0.252em"> ≤ p ≤ p</tspan><tspan dy="0.35em" font-size="72%">max</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<line x1="300" y1="90" x2="410" y2="90" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="355" y="80" font-size="16" text-anchor="middle" font-weight="normal" fill="#6b6b6b">да</text>
<line x1="300" y1="280" x2="410" y2="280" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="355" y="270" font-size="16" text-anchor="middle" font-weight="normal" fill="#6b6b6b">да</text>
<line x1="300" y1="470" x2="410" y2="470" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="355" y="460" font-size="16" text-anchor="middle" font-weight="normal" fill="#6b6b6b">да</text>
<path d="M170,512 L170,590 L410,590" fill="none" stroke="#111111" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="185" y="560" font-size="16" text-anchor="start" font-weight="normal" fill="#6b6b6b">нет</text>
<rect x="805.0" y="130.0" width="250" height="110" rx="6" fill="#d9d9d9" stroke="#111111" stroke-width="1.6"/>
<text x="930" y="169.34" font-size="18" text-anchor="middle" font-weight="bold" fill="#111111">Гибридный (HP)</text>
<text x="930" y="191.3" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">p = ω·p<tspan dy="0.35em" font-size="72%">CP</tspan><tspan dy="-0.252em"> +</tspan></text>
<text x="930" y="213.26" font-size="18" text-anchor="middle" font-weight="normal" fill="#111111">(1 − ω)·p<tspan dy="0.35em" font-size="72%">MB</tspan><tspan dy="-0.252em">&#8203;</tspan></text>
<line x1="710" y1="110" x2="820" y2="165" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arg)"/>
<line x1="710" y1="265" x2="820" y2="210" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arg)"/>
<line x1="930" y1="240" x2="930" y2="346.98" stroke="#6b6b6b" stroke-width="1.0"/>
<circle cx="930" cy="240" r="3" fill="#111111"/>
<rect x="824.44" y="346.98" width="211.12" height="46.04" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
<text x="930.0" y="365.68" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">если применимы MB и CP</text>
<text x="930.0" y="385.2" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">одновременно</text>
<line x1="710" y1="470" x2="806.52" y2="470" stroke="#6b6b6b" stroke-width="1.0"/>
<circle cx="710" cy="470" r="3" fill="#111111"/>
<rect x="806.52" y="456.98" width="246.96000000000004" height="46.04" rx="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1"/>
<text x="930.0" y="475.68" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">теневая оценка учитывается</text>
<text x="930.0" y="495.2" font-size="16" text-anchor="middle" font-weight="normal" fill="#111111">отдельно от денежной цены</text>
</svg>

"Q0"]},Z_pl:{sym:"Z_пл",name:"Затраты платформы",group:"Эффект",what:"Аннуитет вложений в платформу (24,6), эксплуатация (30) и издержки сделок и аудита (15) — 69,6 млн руб. в год.",effect:"Постоянны и на φ не умножаются: при низкой связности платформа убыточна. Поглощают 29 % валовой экономии.",src:"Глава 2, табл. 2.6, § 2.5.4.",rel:["dE_t","C_min"]},dE_base:{sym:"ΔE_base",name:"Чистый эффект при полной реализации",group:"Эффект",what:"Дополнительный эффект экоплатформы при φ = 1: сумма вкладов потоков минус затраты платформы. Заменяет валовые 250 млн руб. прежней версии симулятора.",calc:"ΔE_base = Σ(E_i − A_i) − Z_пл = 187,1 − 69,6 = 117,4 млн руб./год",src:"Глава 2, табл. 2.6; перенос в симулятор — табл. 3.7.",rel:["dE_t","flows","Z_pl"]},dE_t:{sym:"ΔE(t)",name:"Верифицированный дополнительный эффект",group:"Эффект",what:"Изменение денежных потоков участников относительно состояния «без платформы» за вычетом затрат на создание и поддержание связей.",calc:"ΔE(t) = φ(C_инд) · Σ(E_i − A_i) − Z_пл (2.7) в редакции симулятора",effect:"База симбиотического дивиденда; при ΔE < 0 дивиденд не начисляется и долг не переносится.",src:"Глава 2, § 2.3.1; контрфактическое правило «с платформой — без платформы».",rel:["SD","phi","Z_pl","C_min"]},C_min:{sym:"C_min",name:"Порог окупаемости платформы",group:"Эффект",what:"Связность, при которой реализованный эффект потоков покрывает постоянные затраты платформы: ΔE(t) = 0.",calc:"C_min = −ln(1 − Z_пл / Σ(E_i − A_i)) / k",effect:"При k = 5 около 0,093. Ниже порога платформа уменьшает общественный результат — задача оператора вывести сеть за порог.",src:"Следует из (2.5) и (2.7); кандидат в элементы новизны (§ 3.2).",rel:["dE_t","Z_pl","k"]},dE_exp:{sym:"ΔE_ожид",name:"Ожидаемый эффект с риском якоря",group:"Эффект",what:"Эффект с учётом того, что в доле периода π_A якорь не поставляет CO₂, а аннуитет вложений сохраняется.",calc:"ΔE_ожид = (Σ − π_A · E_CO₂) · φ − Z_пл",src:"§ 3.2.4, формулы (3.24)–(3.25).",rel:["pi_A","dE_t"]},Q0:{sym:"Q₀",name:"Базовые продажи пищевой CO₂",group:"Эффект",what:"Объём, который «Азот» продаёт с декабря 2018 г. без платформы: 32 тыс. т в год. Связь уже действует.",calc:"ΔE_CO₂ = (Q₁ − Q₀) · (p_альт − c) − A_CO₂ (3.11)",effect:"Эффект платформы даёт только прирост сверх Q₀. Переключение прежних покупателей на резидентов эффекта не создаёт: при 50 % переключения ΔE падает со 117,4 до 81,4.",src:"Класс A (первичный факт); § 3.1.6.",rel:["dQ","switch","mu"]},dQ:{sym:"Q₁ − Q₀",name:"Прирост продаж CO₂",group:"Эффект",what:"Дополнительные поставки технологического CO₂ сверх базовых 32 тыс. т, вызванные платформой.",effect:"Базовое значение 12 тыс. т (табл. 2.5: 8–15). Через u входит в эффект отдачи (3.28).",src:"Допущение, класс C.",rel:["Q0","u"]},switch:{sym:"Доля переключения",name:"Поставки за счёт переключения покупателей",group:"Эффект",what:"Часть поставок резидентам, которая раньше уходила другим покупателям. Договор появляется, совокупные продажи не растут.",effect:"Уменьшает вклад потока CO₂; проверяется только по помесячной отгрузке всем покупателям (§ 3.5).",src:"§ 2.3.2, § 3.1.6.",rel:["Q0"]},mu:{sym:"μ",name:"Признак углеродного вычета (CBAM)",group:"Эффект",what:"Равен 1, если переданный CO₂ вычитается из встроенных выбросов продукции якоря (постоянное связывание или геологическое хранение), иначе 0.",calc:"ΔE_f = ΔE_f^рын + μ_f · q_f · p_C (3.12)",effect:"Для напитков, сухого льда, теплиц и карбамида μ = 0: симбиоз не снижает углеродную нагрузку экспорта «Азота».",src:"Регламенты ЕС 2023/956, 2023/1773, 2024/2620; § 3.1.6. Класс A.",rel:["carbon"]},SD:{sym:"SD(t)",name:"Симбиотический дивиденд",group:"Дивиденд",what:"Доля подтверждённого эффекта, которая по заранее оговорённым правилам распределяется между участниками, оператором, бюджетом и экофондом.",calc:"SD(t) = α · M · max(0; ΔE(t)) (2.11)",effect:"Премия, а не основа стимулов: основной выигрыш резидента возникает в цене обмена. Около 5 % валовой экономии.",src:"Глава 1, § 1.4.1; глава 2, § 2.3.2.",rel:["alpha","M","dE_t","beta"]},alpha:{sym:"α",name:"Коэффициент дивиденда",group:"Дивиденд",what:"Доля подтверждённого эффекта, направляемая в распределительный механизм. Фиксируется соглашением до начала периода.",calc:"α ∈ [0,08; 0,12]",effect:"Линейно увеличивает SD, но почти не меняет участие малых резидентов: их доля дивиденда мала (следствие 2 табл. 3.8).",src:"Глава 2, § 2.3.2.",rel:["SD","sigma"]},M:{sym:"M",name:"Множитель режима распределения",group:"Дивиденд",what:"Повышающий коэффициент режима: фискальный 1,00, технологический 1,12, промышленный 1,18.",src:"Параметр симулятора, класс C.",rel:["SD"]},beta:{sym:"β(C)",name:"Доля бюджета территории (схема В)",group:"Дивиденд",what:"Доля дивиденда бюджету города, принимающего экологическую нагрузку. Растёт со связностью.",calc:"β(C) = 0,45 · φ + 0,25 · (1 − φ) (2.18)",src:"Глава 2, § 2.5.2.",rel:["gamma_gov","SD","ecofund"]},gamma_gov:{sym:"γ_гос(C)",name:"Доля публичного партнёра (схема Б)",group:"Дивиденд",what:"Возврат публичному инвестору в инфраструктуру; убывает с ростом связности, когда риск снижается.",calc:"γ_гос = 0,15 + (0,40 − 0,15) · (1 − φ) (2.17)",effect:"Противоположная динамика β и γ_гос — не противоречие: это две разные роли государства.",src:"Глава 2, § 2.5.2.",rel:["beta"]},gamma_res:{sym:"γ_рез",name:"Доля группы резидентов",group:"Дивиденд",what:"Часть дивиденда, распределяемая между резидентами пропорционально их подтверждённому эффекту.",calc:"D_j = γ_рез · SD · ΔE_j / ΣΔE_все (2.20′); доля неподключённых остаётся в резерве",effect:"Нормировка на весь потенциальный эффект группы убирает размывание дивиденда, поэтому Γ(C) не убывает.",src:"Глава 2, (2.20); уточнение для § 3.2.",rel:["SD","Gamma"]},ecofund:{sym:"Экофонд",name:"Экофонд ликвидации ущерба",group:"Дивиденд",what:"Постоянная доля 8 % дивиденда на рекультивацию фосфогипса, очистку вод.",src:"Схема В, (2.18).",rel:["C_liq","beta"]},shapley:{sym:"Sh_i",name:"Вектор Шепли",group:"Дивиденд",what:"Справедливая доля участника

ва 2, табл. 2.6, § 2.5.4.",rel:["dE_t","C_min"]},dE_base:{sym:"ΔE_base",name:"Чистый эффект при полной реализации",group:"Эффект",what:"Дополнительный эффект экоплатформы при φ = 1: сумма вкладов потоков минус затраты платформы. Заменяет валовые 250 млн руб. прежней версии симулятора.",calc:"ΔE_base = Σ(E_i − A_i) − Z_пл = 187,1 − 69,6 = 117,4 млн руб./год",src:"Глава 2, табл. 2.6; перенос в симулятор — табл. 3.7.",rel:["dE_t","flows","Z_pl"]},dE_t:{sym:"ΔE(t)",name:"Верифицированный дополнительный эффект",group:"Эффект",what:"Изменение денежных потоков участников относительно состояния «без платформы» за вычетом затрат на создание и поддержание связей.",calc:"ΔE(t) = φ(C_инд) · Σ(E_i − A_i) − Z_пл (2.7) в редакции симулятора",effect:"База симбиотического дивиденда; при ΔE < 0 дивиденд не начисляется и долг не переносится.",src:"Глава 2, § 2.3.1; контрфактическое правило «с платформой — без платформы».",rel:["SD","phi","Z_pl","C_min"]},C_min:{sym:"C_min",name:"Порог окупаемости платформы",group:"Эффект",what:"Связность, при которой реализованный эффект потоков покрывает постоянные затраты платформы: ΔE(t) = 0.",calc:"C_min = −ln(1 − Z_пл / Σ(E_i − A_i)) / k",effect:"При k = 5 около 0,093. Ниже порога платформа уменьшает общественный результат — задача оператора вывести сеть за порог.",src:"Следует из (2.5) и (2.7); кандидат в элементы новизны (§ 3.2).",rel:["dE_t","Z_pl","k"]},dE_exp:{sym:"ΔE_ожид",name:"Ожидаемый эффект с риском якоря",group:"Эффект",what:"Эффект с учётом того, что в доле периода π_A якорь не поставляет CO₂, а аннуитет вложений сохраняется.",calc:"ΔE_ожид = (Σ − π_A · E_CO₂) · φ − Z_пл",src:"§ 3.2.4, формулы (3.24)–(3.25).",rel:["pi_A","dE_t"]},Q0:{sym:"Q₀",name:"Базовые продажи пищевой CO₂",group:"Эффект",what:"Объём, который «Азот» продаёт с декабря 2018 г. без платформы: 32 тыс. т в год. Связь уже действует.",calc:"ΔE_CO₂ = (Q₁ − Q₀) · (p_альт − c) − A_CO₂ (3.11)",effect:"Эффект платформы даёт только прирост сверх Q₀. Переключение прежних покупателей на резидентов эффекта не создаёт: при 50 % переключения ΔE падает со 117,4 до 81,4.",src:"Класс A (первичный факт); § 3.1.6.",rel:["dQ","switch","mu"]},dQ:{sym:"Q₁ − Q₀",name:"Прирост продаж CO₂",group:"Эффект",what:"Дополнительные поставки технологического CO₂ сверх базовых 32 тыс. т, вызванные платформой.",effect:"Базовое значение 12 тыс. т (табл. 2.5: 8–15). Через u входит в эффект отдачи (3.28).",src:"Допущение, класс C.",rel:["Q0","u"]},switch:{sym:"Доля переключения",name:"Поставки за счёт переключения покупателей",group:"Эффект",what:"Часть поставок резидентам, которая раньше уходила другим покупателям. Договор появляется, совокупные продажи не растут.",effect:"Уменьшает вклад потока CO₂; проверяется только по помесячной отгрузке всем покупателям (§ 3.5).",src:"§ 2.3.2, § 3.1.6.",rel:["Q0"]},mu:{sym:"μ",name:"Признак углеродного вычета (CBAM)",group:"Эффект",what:"Равен 1, если переданный CO₂ вычитается из встроенных выбросов продукции якоря (постоянное связывание или геологическое хранение), иначе 0.",calc:"ΔE_f = ΔE_f^рын + μ_f · q_f · p_C (3.12)",effect:"Для напитков, сухого льда, теплиц и карбамида μ = 0: симбиоз не снижает углеродную нагрузку экспорта «Азота».",src:"Регламенты ЕС 2023/956, 2023/1773, 2024/2620; § 3.1.6. Класс A.",rel:["carbon"]},SD:{sym:"SD(t)",name:"Симбиотический дивиденд",group:"Дивиденд",what:"Доля подтверждённого эффекта, которая по заранее оговорённым правилам распределяется между участниками, оператором, бюджетом и экофондом.",calc:"SD(t) = α · max(0; ΔE(t)) (2.11)",effect:"Премия, а не основа стимулов: основной выигрыш резидента возникает в цене обмена. Около 5 % валовой экономии.",src:"Глава 1, § 1.4.1; глава 2, § 2.3.2.",rel:["alpha","dE_t","beta"]},alpha:{sym:"α",name:"Коэффициент дивиденда",group:"Дивиденд",what:"Доля подтверждённого эффекта, направляемая в распределительный механизм. Фиксируется соглашением до начала периода.",calc:"α ∈ [0,08; 0,12]",effect:"Линейно увеличивает SD, но почти не меняет участие малых резидентов: их доля дивиденда мала (следствие 2 табл. 3.8).",src:"Глава 2, § 2.3.2.",rel:["SD","sigma"]},beta:{sym:"β(C)",name:"Доля бюджета территории (схема В)",group:"Дивиденд",what:"Доля дивиденда бюджету города, принимающего экологическую нагрузку. Растёт со связностью.",calc:"β(C) = 0,45 · φ + 0,25 · (1 − φ) (2.18)",src:"Глава 2, § 2.5.2.",rel:["gamma_gov","SD","ecofund"]},gamma_gov:{sym:"γ_гос(C)",name:"Доля публичного партнёра (схема Б)",group:"Дивиденд",what:"Возврат публичному инвестору в инфраструктуру; убывает с ростом связности, когда риск снижается.",calc:"γ_гос = 0,15 + (0,40 − 0,15) · (1 − φ) (2.17)",effect:"Противоположная динамика β и γ_гос — не противоречие: это две разные роли государства.",src:"Глава 2, § 2.5.2.",rel:["beta"]},gamma_res:{sym:"γ_рез",name:"Доля группы резидентов",group:"Дивиденд",what:"Часть дивиденда, распределяемая между резидентами пропорционально их подтверждённому эффекту.",calc:"D_j = γ_рез · SD · ΔE_j / ΣΔE_все (2.20′); доля неподключённых остаётся в резерве",effect:"Нормировка на весь потенциальный эффект группы убирает размывание дивиденда, поэтому Γ(C) не убывает.",src:"Глава 2, (2.20); уточнение для § 3.2.",rel:["SD","Gamma"]},ecofund:{sym:"Экофонд",name:"Экофонд ликвидации ущерба",group:"Дивиденд",what:"Постоянная доля 8 % дивиденда на ликвидацию накопленного экологического ущерба (схема В).",src:"Схема В, (2.18).",rel:["C_liq","beta"]},shapley:{sym:"Sh_i",name:"Вектор Шепли",group:"Дивиденд",what:"Справедливая доля участника — средний предельный вклад по всем порядкам присоединения к коалиции. Используется как контрольный критерий, а не правило выплат.",calc:"Sh_i(v̄) = (1 − π_A) · Sh_i(v) + π_A · Sh_i(v_−A) (3.25)",effect:"При s = 0,3 на «Азот» приходится 25 % эффекта, с поправкой на риск остановки — 0,95 · 29,4 ≈ 27,9 млн руб.",src:"Глава 1, (1.9); § 2.5.3; § 3.2.4.",rel:["pi_A"]},C_liq:{sym:"C_ликв",name:"Потребность в ликвидации ущерба",group:"Бюджет",what:"Годовые средства на ликвидацию накопленного экологического ущерба: 15,5–20,5 млн руб.",calc:"Ограничение γ_пуб · SD(C**) + B_внеш ≥ C_ликв (3.21)",effect:"Одним дивидендом не покрывается ни в одном сценарии: бюджет получает 1–4 млн руб.",src:"Параметр симулятора, класс C.",rel:["B_ext","beta","ecofund"]},B_ext:{sym:"B_внеш",name:"Внешний источник финансирования",group:"Бюджет",what:"Средства на ликвидацию ущерба вне дивиденда: целевое использование платы за НВОС, межбюджетный трансферт края городу, соглашения о партнёрстве.",effect:"Закрывает дефицит (3.21). Для края — расход, для города — доход: перенос между уровнями бюджета.",src:"§ 3.2.3; табл. 3.7.",rel:["C_liq","nvos"]},nvos:{sym:"ΔНВОС",name:"Выпадающая плата за НВОС",group:"Бюджет",what:"Плата за негативное воздействие, которую предприятия перестают платить, выводя отходы из размещения. Для них — экономия, для бюджета — потеря дохода.",effect:"С 01.01.2026 плата зачисляется в бюджет субъекта на 100 % (488-ФЗ), долю города устанавливает край. Поэтому эффект в расширенной границе меньше: ΔE − ΔНВОС.",src:"Ставка 663,2 руб./т (ПП РФ № 913); БК РФ в ред. 488-ФЗ.",rel:["balance","B_ext"]},balance:{sym:"Σ = ΔE − ΔНВОС",name:"Замыкание баланса бенефициаров",group:"Бюджет",what:"Платформа создаёт новую стоимость только в размере ΔE. Цена обмена, дивиденд, налоги, σ и B_внеш — переливы. Сумма чистых выигрышей всех бенефициаров равна ΔE минус выпадающая плата за НВОС.",effect:"Если сумма больше — где-то двойной счёт.",src:"Методическое правило вкладки «Бенефициары и стратегии».",rel:["nvos","dE_t","omega"]},omega:{sym:"ω",name:"Положение цены в коридоре",group:"Бюджет",what:"Доля выигрыша обмена, достающаяся поставщику. 0,5 — середина коридора (решение Нэша при равной переговорной силе).",calc:"p_min = c_ij + o_i ≤ p_ij ≤ p_max = p_альт − c_подг (2.14)",effect:"Меняет распределение выигрыша между поставщиками и резидентами, но не его сумму.",src:"Глава 2, § 2.4.2.",rel:["balance"]},tax:{sym:"Налог",name:"Налог на прибыль с прироста эффекта",group:"Бюджет",what:"25 %: 8 % — федеральный бюджет, 17 % — бюджет края. Для резидентов ТОСЭР в период льготы: 0 % федеральная часть, пониженная региональная (параметр).",src:"НК РФ (ред. с 2025 г.); льготы ТОСЭР — сверить с законом СК. Класс C.",rel:["balance"]},U_j:{sym:"U_j",name:"Выигрыш резидента от участия",group:"Двухуровневая модель",what:"Чистый годовой выигрыш резидента j: экономия в цене обмена плюс доля дивиденда минус не компенсированные затраты подключения.",calc:"U_j = g_j(C) + w_j · γ_рез · SD(C) − (1 − σ) · c_j ≥ 0 (3.15)",effect:"Резидент участвует, если U_j ≥ 0. Связность входит дважды — через цену и через дивиденд, поэтому решения резидентов взаимозависимы.",src:"§ 3.2.2.",rel:["sigma","gamma_res","Gamma"]},lambda:{sym:"λ_j, λ̄",name:"Доля продаж якорю и предел ТОСЭР",group:"Двухуровневая модель",what:"Доля выручки инвестпроекта резидента от продаж градообразующей организации. Норма запрещает более 50 %; закупки у якоря под предел не подпадают.",calc:"λ_j = R_jA^пр / R_j^пр ≤ λ̄ = 0,5 (3.16)",effect:"Резидент, продающий якорю больше половины, исключается из сети. Правило: обмен, где якорь — покупатель, проектировать сразу со вторым покупателем.",src:"ПП РФ от 22.06.2015 № 614 (ред. ПП № 1179 от 21.07.2023). Класс A.",rel:["lambda_star"]},lambda_star:{sym:"λ*_j",name:"Критическая доля продаж якорю",group:"Двухуровневая модель",what:"Наибольшая доля продаж якорю, при которой резидент покрывает постоянные затраты во время остановки якоря.",calc:"λ*_j = 1 − FC_j / (m_j · R_j^пр) (3.27)",effect:"Единая норма 0,5 мягка для низкомаржинальных (λ* = 0,40 при m = 0,25, FC = 15 %) и жёстка для высокомаржинальных (λ* = 0,70).",src:"§ 3.2.4; следствие 3 табл. 3.8.",rel:["lambda","pi_A"]},Gamma:{sym:"Γ(C; θ)",name:"Отображение «ожидаемая → фактическая связность»",group:"Двухуровневая модель",what:"Связность, которая возникает, если каждый резидент решает об участии, ожидая связность C.",calc:"Γ(C; θ) = (1/N_доп) Σ n_j · I[U_j ≥ 0] · I[λ_j ≤ λ̄] (3.17)",effect:"Если Γ не убывает, по теореме Тарского существует наименьшая неподвижная точка — равновесие C**. Монотонность проверяется в симуляторе на сетке.",src:"§ 3.2.2.",rel:["C_eq","U_j","gamma_res"]},C_eq:{sym:"C**",name:"Равновесная связность",group:"Двухуровневая модель",what:"Связность, которая складывается из индивидуальных решений резидентов при старте сети с нуля.",calc:"C** = min{C ∈ [0; 1]: C = Γ(C; θ)} (3.18)",effect:"Без мер поддержки ниже оптимальной C* (следствие 1 табл. 3.8).",src:"§ 3.2.2.",rel:["Gamma","C_star","dC"]},C_star:{sym:"C*",name:"Оптимальная связность",group:"Двухуровневая модель",what:"Связность, которую выбрал бы планировщик: предельный эффект равен предельным издержкам связности.",calc:"G · k · e^(−k·C*) = 2τ · C* (2.13), где Π(C) = G·φ(C) − T₀ − τ·C² (2.12)",effect:"Платформа сдвигает оптимум вправо: 0,19 → 0,23 в постановке главы 2. Оптимум ниже единицы — вовлекать все связи невыгодно.",src:"Глава 2, § 2.3.3: G = 400, T₀ = 30, τ = 2000 / 1200.",rel:["C_eq","Pi","dC"]},dC:{sym:"Δ_C",name:"Разрыв связности",group:"Двухуровневая модель",what:"Сколько связей сеть недобирает из-за правил распределения, барьеров подключения и регуляторных ограничений.",calc:"Δ_C(θ) = C* − C**(θ) (3.19)",effect:"Аналог «разрыва эффективности» в энергосбережении: выгодно обществу, но фирмы не принимают — затраты каждая несёт в одиночку.",src:"§ 3.2.2.",rel:["C_star","C_eq","Z_min"]},Pi:{sym:"Π(C)",name:"Чистый результат сети",group:"Двухуровневая модель",what:"Валовой эффект при связности C минус постоянные и растущие издержки связности.",calc:"Π(C) = G · φ(C) − T₀ − τ · C² (2.12)",src:"Глава 2, § 2.3.3 (условная постановка).",rel:["C_star","W"]},W:{sym:"W",name:"Чистый общественный результат механизма",group:"Двухуровневая модель",what:"Результат сети при равновесной (а не оптимальной) связности за вычетом бюджетных затрат на механизм. Критерий сравнения механизмов.",calc:"max_θ W(θ) = Π(C**(θ)) − Z(θ) (3.20)",effect:"Сравнивать механизмы по дивиденду нельзя: SD растёт просто от повышения α.",src:"§  и др.).",diff:"В известных постановках нет якорного предприятия, нормы 50 % режима ТОСЭР в моногороде и бюджетного условия ликвидации накопленного ущерба (3.21). Все три элемента встроены в модель; при правиле дивиденда (2.20′) Γ не убывает по C, и равновесие существует по теореме Тарского.",check:"Переключайте механизм и сдвигайте σ: ступенчатая линия Γ смещается, точка C** — её первое пересечение с биссектрисой. Γ ни на одном участке не убывает."},N2:{tag:"Н2",level:"N",tab:"bilevel",title:"Цена закрытия разрыва связности Z_min и целевая связность Ĉ",claim:"Разрыв между оптимальной и равновесной связностью получил денежную меру — минимальные затраты механизма Z_min(C̃), при которых равновесие достигает уровня C̃. Целевая связность Ĉ максимизирует Π(C̃) − Z_min(C̃) и может лежать ниже оптимума: последние связи обходятся бюджету дороже, чем приносят сети.",where:"§ 3.2.3; формулы (3.22)–(3.23); вывод 2 по главе 3",prior:"Разрыв эффективности известен в экономике энергосбережения (Gerarden, Newell, Stavins); порог полезности платформы симбиоза показан на агентной модели (Fraccascia).",diff:"Разрыв выражен в рублях бюджетной поддержки, а не в доле неосвоенного потенциала; из (3.23) следует вывод, недоступный в постановке главы 2: добиваться C* не всегда нужно.",check:"На графике справа максимум разности Π(Ĉ) − Z_min(Ĉ) задаёт Ĉ; при росте τ максимум смещается влево от C*."},N3:{tag:"Н3",level:"N",tab:"bilevel",title:"Риск остановки якоря в распределении эффекта и критическая доля зависимости резидента",claim:"Вектор Шепли скорректирован на вероятность остановки якоря π_A: доля якоря уменьшается в (1 − π_A) раз, выигрывают участники с резервными связями. Норма 50 % сопоставлена с критической долей зависимости λ*_j = 1 − FC_j/(m_j·R_j): для низкомаржинальных резидентов норма мягка, для высокомаржинальных жёстка.",where:"§ 3.2.4; формулы (3.24)–(3.27); вывод 2 по главе 3",prior:"Вектор Шепли и ядро с поправкой на риск остановки применялись к межзаводской теплоинтеграции трёх заводов (Jin, Li, Jiang; Jin, Chang и др.).",diff:"Поправка перенесена на игру пяти участников с якорем-болваном в игре v₋A и соединена с регуляторной нормой ТОСЭР; получено проверяемое по отчётности резидентов условие (3.27).",check:"На основной вкладке меняйте m_j и FC_j/R_j: λ*_j переходит через 0,5, и вывод о норме меняется. Во вкладке модели таблица поставщиков показывает λ*_j по каждому резиденту."},N4:{tag:"Н4",level:"N",tab:"simulation",title:"Экономическая граница состояний экосистемы — порог окупаемости платформы C_min",claim:"Три состояния экосистемы, выделявшиеся сценарно, получили экономическое содержание. Граница переходного и экосистемного состояний задаётся порогом C_min = −ln(1 − Z_пл/ΣE)/k; он снижается с 0,089 в 2027 г. до 0,062 в 2036 г. Переходное состояние — зона, где платформа уже несёт затраты, а связей недостаточно для их возмещения.",where:"§ 3.3.2; формула (3.34); вывод 3 по главе 3",prior:"Стадии развития эко-индустриальных парков описывались качественно или по пороговым долям связей; в главе 2 пороги состояний (5 и 15 %) заданы сценарно.",diff:"Порог выведен из модели: постоянные затраты платформы не умножаются на φ, поэтому ниже C_min эффект отрицателен при любом распределении. Сценарная шкала и экономическая граница расходятся, и это показано в табл. 3.10.",check:"Сдвигайте «Связность C_инд»: ΔE(t) меняет знак ровно в точке C_min. Смена k или года прогноза перемещает порог."},N5:{tag:"Н5",level:"N",tab:"bilevel",title:"Сравнение механизмов: компенсация затрат подключения против дивиденда",claim:"При равновесной связности 0,17–0,21 дополнительный эффект платформы составляет 40–78 млн руб. в год, а не 117,4 млн руб. полной реализации. Дивиденд почти не влияет на участие резидентов; компенсация 30 % затрат подключения добавляет четырёх участников при бюджетных затратах около 2,6 млн руб. в год и повышает устойчивость эффекта к опасностям.",where:"§ 3.2.3, 3.3.3–3.3.4; вывод 5 по главе 3",prior:"Экологический налог как инструмент согласования спроса и предложения отходов в цепи симбиоза (Dong, Liu, Zhao); обучение кооперации при стабильных правилах раздела выгод (Yazan и др.).",diff:"Механизмы сравниваются по одному критерию W = Π(C**) − Z в равновесии, а не при заданной связности; устойчивость выбора проверена методом Монте-Карло при разных моделях поведения резидентов.",check:"Нажмите «Монте-Карло»: доля испытаний, где лидирует компенсация σ, выше, чем у дивиденда, при всех моделях поведения. В браузере 200 испытаний для скорости; матрица «поведение × механизм» в тексте (табл. 3.11а) рассчитана на 1000 испытаниях. Монте-Карло § 3.3.4 (5000 испытаний × 5 сценариев рисков) — другой эксперимент."},N6:{tag:"Н6",level:"N",tab:"benef",title:"Баланс бенефициаров и источник ликвидации накопленного ущерба",claim:"Дивиденд не покрывает потребность в ликвидации накопленного ущерба ни при одном сочетании параметров: внешний источник должен давать 86–91 % средств. Основной выигрыш получают резиденты ТОСЭР, основной проигравший — бюджет города, теряющий плату за НВОС, которая направляется на ликвидацию вреда; механизм обязан замещать этот источник.",where:"§ 3.3.5; условие (3.21); вывод 6 по главе 3",prior:"Распределение выгод симбиоза обычно рассматривается между предприятиями; бюджетные последствия и целевой характер платы за НВОС в моделях эко-индустриальных парков не учитывались.",diff:"Построен замыкаемый баланс Σ = ΔE − ΔНВОС с разнесением по бюджетам федерального, краевого и городского уровней и проверкой замыкания в каждом году.",check:"Во вкладке «Бенефициары и стратегии» строка проверки замыкания равна нулю в каждом году; бюджет города получает отрицательный итог. На основной вкладке условие «2. Бюджет» не выполняется при B_внеш = 0."},A1:{tag:"А1",level:"A",tab:"simulation",title:"Калибровка закрытых параметров якоря по 19 азотным комплексам-аналогам",claim:"Параметры, которые «Азот» не раскрывает, откалиброваны по открытой отчётности 19 интегрированных азотных комплексов США; перенос ограничен относительной динамикой и удельными показателями, каждому параметру присвоен класс качества. Эффект засчитывается только для прироста продаж CO₂ сверх 32 тыс. т, углеродная часть по правилам CBAM равна нулю.",where:"§ 3.1; формулы (3.1)–(3.12); вывод 1 по главе 3",prior:"Перенос показателей с аналогов и классы качества данных — известная практика оценки при закрытой отчётности.",diff:"Правила переноса сформулированы для якорного предприятия моногорода; получены ряды 2017–2026 гг. и вывод, что обмены CO₂ ограничены спросом, а не предложением.",check:"Переключите очистку N₂O (вариант A / B): ряды и граница учёта меняются, а состав ΔE_base — нет, поскольку μ = 0."},A2:{tag:"А2",level:"A",tab:"bilevel",title:"Поправка эффекта платформы на эффект отдачи",claim:"Если платформа увеличивает выпуск якоря, сокращение выбросов может быть съедено ростом производства; выведено условие (3.29), при котором чистое изменение выбросов отрицательно, и скорректированный эффект (3.30).",where:"§ 3.2.5; формулы (3.28)–(3.30)",prior:"Эффект отдачи известен в экономике энергоэффективности.",diff:"Условие записано в долях использования побочного продукта u и доли переключения κ и откалибровано по рядам 2017–2026 гг.",check:"Меняйте ΔQ/Q₀, долю u и κ: при выполнении (3.29) прирост выбросов ΔEm становится отрицательным. Во вкладке «Бенефициары и стратегии» те же условия показаны на траекториях выбросов до 2040 г."}},Ac=["N1","N2","N3","N4","N5","N6","A1","A2"],WV=["Вывод 4: информационный барьер поиска и согласования не ниже 1,75 млн руб. в год на резидента (§ 3.3.3, формула 3.35).","Вывод 7: трёхкомпонентный индекс устойчивого развития экосистемы (§ 3.4).","Вывод 8: организационно-экономический механизм с тремя финансовыми контурами и дорожная карта 2027–2036 гг. (§ 3.5)."];function Ht(...e){return yu(We(e))}const Er="#7c3aed";function QV({open:e,onClose:t,onOpen:r,isDarkMode:n,defense:l,onGo:o}){const[c,d]=j.useState(null),[h,m]=j.useState(null),[p,g]=j.useState(!1),[b,x]=j.useState("");j.u
